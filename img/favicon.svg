<!--
  FAVICON.SVG
  El ícono chiquito que aparece en la pestaña del navegador y en
  marcadores. Es un SVG (no un .ico) porque es la forma moderna y
  más simple de hacerlo: un solo archivo, se ve nítido en cualquier
  tamaño de pantalla. Si más adelante diseñas un logo real, puedes
  reemplazar este archivo por tu propio ícono.
-->
