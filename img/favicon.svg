  <circle cx="32" cy="32" r="32" fill="#14332e"/>
  <path d="M32 14 C40 26 46 33 46 41 A14 14 0 0 1 18 41 C18 33 24 26 32 14 Z" fill="#a9793c"/>
</svg>
